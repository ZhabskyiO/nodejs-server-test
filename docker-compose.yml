name: nodejs-server-test

services:
  postgres:
    image: postgres:16
    container_name: nodejs-server-test-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: apitest
      POSTGRES_PASSWORD: apitest
      POSTGRES_DB: apitest
    ports:
      # 5433 on the host: 5432 is commonly taken by another local Postgres.
      - "5433:5432"
    volumes:
      - nodejs_server_test_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apitest -d apitest"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nodejs_server_test_pgdata:
    name: nodejs_server_test_pgdata
